<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>بطاقتي — المجال الإداري</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='10' y='24' width='80' height='52' rx='10' fill='%2317181C'/%3E%3Crect x='18' y='34' width='20' height='20' rx='4' fill='%23F4F3EF'/%3E%3Crect x='44' y='36' width='38' height='5' rx='2.5' fill='%23CE1126'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F3EF; --surface:#FFFFFF;
    --ink:#17181C; --ink-soft:#53565C; --ink-faint:#8A8D93;
    --line:#E3E1D9;
    --red:#CE1126; --red-deep:#9C0E1E; --red-tint:#FBE9EA;
    --gold:#9C7A3C; --gold-tint:#F3ECDD;
    --green:#0C9A63; --green-tint:#E7F6EE;
    --blue:#2563EB; --blue-tint:#DBEAFE;
    --radius:14px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{overflow-x:hidden;max-width:100vw;height:100%;}
  body{
    font-family:'IBM Plex Sans Arabic',sans-serif;
    background:var(--paper);color:var(--ink);
    line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  button,input{font-family:inherit;font-size:16px;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* ═══ LOCK SCREEN ═══ */
  .lock-screen{
    position:fixed;inset:0;z-index:99999;
    background:linear-gradient(135deg,var(--ink) 0%,#0a0a0f 100%);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .lock-card{
    background:var(--surface);border-radius:20px;padding:36px 32px;
    max-width:400px;width:100%;text-align:center;
    box-shadow:0 24px 60px rgba(0,0,0,.4);
    max-height:92vh;overflow-y:auto;
  }
  .lock-icon{
    width:64px;height:64px;border-radius:50%;
    background:var(--red-tint);color:var(--red);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 18px;flex-shrink:0;
  }
  .lock-icon svg{width:30px;height:30px;}
  .lock-card h1{font-family:'El Messiri',sans-serif;font-size:22px;font-weight:700;margin-bottom:6px;}
  .lock-card p{font-size:13px;color:var(--ink-soft);margin-bottom:22px;}
  .lock-input-wrap{position:relative;margin-bottom:14px;}
  .lock-input{
    width:100%;padding:14px 48px 14px 16px;border:1.5px solid var(--line);
    border-radius:10px;background:var(--paper);font-size:16px;
    text-align:center;letter-spacing:2px;direction:ltr;
  }
  .lock-input:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px var(--red-tint);}
  .lock-toggle{
    position:absolute;left:8px;top:50%;transform:translateY(-50%);
    background:none;border:none;color:var(--ink-faint);cursor:pointer;padding:8px;border-radius:8px;
  }
  .lock-toggle:hover{color:var(--ink);}
  .lock-toggle svg{width:18px;height:18px;}
  .lock-btn{
    width:100%;padding:14px;border:none;border-radius:10px;
    background:var(--ink);color:#fff;font-size:14px;font-weight:700;
    cursor:pointer;transition:background .2s;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .lock-btn:hover{background:#000;}
  .lock-btn:disabled{opacity:.6;cursor:not-allowed;}
  .lock-btn .spinner{
    width:16px;height:16px;border:2px solid rgba(255,255,255,.3);
    border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:none;
  }
  .lock-btn.loading .spinner{display:block;}
  .lock-btn.loading .lock-btn-text{display:none;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .lock-error{
    margin-top:14px;padding:10px 14px;background:var(--red-tint);
    color:var(--red-deep);border-radius:8px;font-size:12.5px;font-weight:600;display:none;
  }
  .lock-error.show{display:block;}
  .lock-hint{
    margin-top:18px;padding:10px 14px;background:var(--blue-tint);
    color:#1E3A8A;border-radius:8px;font-size:11.5px;line-height:1.6;text-align:right;
  }

  /* ═══ APP (SPA) ═══ */
  .app{display:none;flex-direction:column;height:100vh;height:100dvh;}
  .app.unlocked{display:flex;}

  /* شريط علوي */
  .topbar{
    background:var(--ink);color:#fff;padding:8px 16px;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    flex-shrink:0;padding-top:calc(8px + var(--safe-top));
  }
  .topbar-brand{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;}
  .topbar-brand .mark{width:24px;height:16px;border-radius:3px;background:var(--red);flex-shrink:0;}
  .topbar-actions{display:flex;gap:6px;align-items:center;}
  .topbar-btn{
    background:none;border:none;color:rgba(255,255,255,.7);cursor:pointer;
    padding:6px;border-radius:8px;display:flex;align-items:center;gap:4px;font-size:11px;
  }
  .topbar-btn:hover{background:rgba(255,255,255,.1);color:#fff;}
  .topbar-btn svg{width:14px;height:14px;}

  /* تبويبات */
  .tabs{
    display:flex;background:var(--surface);border-bottom:1px solid var(--line);
    padding:4px;gap:2px;flex-shrink:0;overflow-x:auto;
  }
  .tab{
    padding:8px 14px;border:none;background:none;cursor:pointer;
    font-size:12px;font-weight:700;color:var(--ink-soft);
    border-radius:8px;display:flex;align-items:center;gap:5px;
    white-space:nowrap;transition:all .15s;flex-shrink:0;
  }
  .tab svg{width:14px;height:14px;}
  .tab:hover{background:var(--paper);color:var(--ink);}
  .tab.active{background:var(--red);color:#fff;}

  /* محتوى التبويبات (iframes) */
  .tab-content{flex:1;position:relative;overflow:hidden;background:var(--paper);}
  .tab-panel{
    position:absolute;inset:0;display:none;
  }
  .tab-panel.active{display:block;}
  .tab-panel iframe{
    width:100%;height:100%;border:none;display:block;
  }

  /* شريط التنقل السفلي (للجوال) */
  .bottom-nav{
    display:none;background:var(--ink);padding:6px;gap:2px;
    flex-shrink:0;padding-bottom:calc(6px + var(--safe-bottom));
  }
  .bottom-nav-btn{
    flex:1;padding:8px 4px;border:none;background:none;color:rgba(255,255,255,.5);
    cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
    border-radius:8px;font-size:9px;font-weight:700;transition:all .15s;
  }
  .bottom-nav-btn svg{width:18px;height:18px;}
  .bottom-nav-btn.active{color:#fff;background:rgba(255,255,255,.1);}
  .bottom-nav-btn:hover{color:rgba(255,255,255,.8);}

  @media(max-width:768px){
    .tabs{display:none;}
    .bottom-nav{display:flex;}
    .app{padding-bottom:0;}
  }
  @media(max-width:480px){
    .topbar-brand{font-size:11px;}
    .topbar-brand .mark{width:20px;height:14px;}
    .topbar-btn{font-size:10px;padding:5px;}
    .bottom-nav-btn{font-size:8px;padding:6px 2px;}
    .bottom-nav-btn svg{width:16px;height:16px;}
  }

  /* منع الخروج */
  img,canvas,svg,table{max-width:100% !important;}
  pre,code{white-space:pre-wrap;word-break:break-word;}
</style>
</head>
<body>

<!-- ═══ LOCK SCREEN ═══ -->
<div class="lock-screen" id="lockScreen">
  <div class="lock-card">
    <div class="lock-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
    </div>
    <h1>بطاقتي — المجال الإداري</h1>
    <p>هذه المنطقة محمية. أدخل الرمز للمتابعة.</p>
    <form id="lockForm">
      <div class="lock-input-wrap">
        <input type="password" class="lock-input mono" id="lockPassword" placeholder="••••••••" autocomplete="current-password" required>
        <button type="button" class="lock-toggle" id="lockToggle" aria-label="إظهار">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <label style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:14px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;">
        <input type="checkbox" id="lockRememberChk" style="cursor:pointer;width:16px;height:16px;">
        <span>تذكّرني على هذا الجهاز لمدة 30 يوماً</span>
      </label>
      <button type="submit" class="lock-btn" id="lockSubmitBtn">
        <span class="spinner"></span>
        <span class="lock-btn-text">متابعة</span>
      </button>
    </form>
    <div class="lock-error" id="lockError"></div>
    <div class="lock-hint">
      🔒 هذه المنطقة مخصصة لصاحب المشروع فقط. كل الأنظمة تعمل في صفحة واحدة بدون تنقل.
    </div>
  </div>
</div>

<!-- ═══ APP (SPA — كل الأنظمة في صفحة واحدة) ═══ -->
<div class="app" id="app">
  <!-- شريط علوي -->
  <div class="topbar">
    <div class="topbar-brand">
      <div class="mark"></div>
      <span>بطاقتي — المجال الإداري</span>
    </div>
    <div class="topbar-actions">
      <button class="topbar-btn" id="btnLogout" title="تسجيل الخروج">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        خروج
      </button>
      <a href="../index.html" class="topbar-btn" title="الموقع العام" style="text-decoration:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        الموقع
      </a>
    </div>
  </div>

  <!-- تبويبات (للكمبيوتر والتابلت) -->
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      لوحة التحكم
    </button>
    <button class="tab" data-tab="invoices">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></svg>
      الفواتير
    </button>
    <button class="tab" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      الإعدادات
    </button>
  </div>

  <!-- محتوى التبويبات -->
  <div class="tab-content">
    <div class="tab-panel active" id="panel-dashboard">
      <iframe src="dashboard.html" id="iframe-dashboard"></iframe>
    </div>
    <div class="tab-panel" id="panel-invoices">
      <iframe src="invoices.html" id="iframe-invoices"></iframe>
    </div>
    <div class="tab-panel" id="panel-settings">
      <iframe src="settings.html" id="iframe-settings"></iframe>
    </div>
  </div>

  <!-- شريط التنقل السفلي (للجوال) -->
  <div class="bottom-nav" id="bottomNav">
    <button class="bottom-nav-btn active" data-tab="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      التحكم
    </button>
    <button class="bottom-nav-btn" data-tab="invoices">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></svg>
      الفواتير
    </button>
    <button class="bottom-nav-btn" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      الإعدادات
    </button>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════════
//  بطاقتي — SPA (كل الأنظمة في صفحة واحدة)
// ════════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const TRACK_ENDPOINT = '/.netlify/functions/track-order';
const PWD_KEY = 'bitaqti_admin_password';
const SESSION_KEY = 'bitaqti_admin_session';

// ═══ AUTH ═══
function getSavedSession(){
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if(!raw) return null;
    const p = JSON.parse(raw);
    if(!p.expiresAt) return null;
    if(Date.now() > p.expiresAt){ localStorage.removeItem(SESSION_KEY); localStorage.removeItem(PWD_KEY); return null; }
    return p;
  } catch(e){ return null; }
}

function getSavedPassword(){
  try { return localStorage.getItem(PWD_KEY) || ''; } catch(e) { return ''; }
}

function saveSession(password, remember){
  try {
    const ttl = remember ? (30 * 24 * 60 * 60 * 1000) : (12 * 60 * 60 * 1000);
    localStorage.setItem(PWD_KEY, password);
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      createdAt: Date.now(),
      expiresAt: Date.now() + ttl,
    }));
  } catch(e) {}
}

function clearSession(){
  try { localStorage.removeItem(SESSION_KEY); } catch(e) {}
  try { localStorage.removeItem(PWD_KEY); } catch(e) {}
}

function unlockApp(){
  $('lockScreen').style.display = 'none';
  $('app').classList.add('unlocked');
}

function lockApp(){
  clearSession();
  $('lockScreen').style.display = 'flex';
  $('app').classList.remove('unlocked');
  $('lockPassword').value = '';
  $('lockError').classList.remove('show');
}

// التحقق التلقائي عند فتح الصفحة
(function checkExistingSession(){
  const savedPwd = getSavedPassword();
  const session = getSavedSession();
  if(savedPwd && session){
    unlockApp();
  } else {
    $('lockScreen').style.display = 'flex';
  }
})();

// bfcache
window.addEventListener('pageshow', () => {
  const savedPwd = getSavedPassword();
  if(savedPwd){
    $('lockScreen').style.display = 'none';
    $('app').classList.add('unlocked');
  } else {
    $('lockScreen').style.display = 'flex';
    $('app').classList.remove('unlocked');
  }
});

// ═══ شاشة القفل ═══
$('lockToggle').addEventListener('click', () => {
  const inp = $('lockPassword');
  inp.type = inp.type === 'password' ? 'text' : 'password';
});

$('lockForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = $('lockPassword').value;
  if(!password) return;
  const btn = $('lockSubmitBtn');
  const rememberChk = $('lockRememberChk');
  btn.disabled = true; btn.classList.add('loading');
  $('lockError').classList.remove('show');
  try{
    const res = await fetch(TRACK_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ admin_password: password, mode: 'sync' }),
    });
    if(res.status === 200){
      saveSession(password, rememberChk && rememberChk.checked);
      unlockApp();
    } else if(res.status === 401){
      showError('الرمز غير صحيح.');
      $('lockPassword').value = ''; $('lockPassword').focus();
    } else if(res.status === 429){
      showError('محاولات كثيرة جداً. انتظر دقيقة.');
    } else if(res.status === 500){
      let data = {};
      try { data = await res.json(); } catch(_) {}
      showError(data.error === 'server_not_configured'
        ? '⚠️ مصدر البيانات غير مُعدّ. اضبط SUPABASE_URL+SUPABASE_SERVICE_KEY أو ORDERS_SHEET_ID في Netlify.'
        : 'الخدمة غير مُعدّة على الخادم.');
    } else if(res.status === 502){
      showError('⚠️ تعذّر الوصول إلى مصدر البيانات (502). راجع TROUBLESHOOTING.md.');
    } else {
      showError(`خطأ في الاتصال (${res.status}).`);
    }
  }catch(err){
    showError('تعذّر الاتصال بالخادم. تحقق من الإنترنت.');
  }finally{
    btn.disabled = false; btn.classList.remove('loading');
  }
  function showError(msg){
    $('lockError').textContent = msg;
    $('lockError').classList.add('show');
  }
});

// ═══ زر الخروج ═══
$('btnLogout').addEventListener('click', () => {
  if(confirm('هل تريد تسجيل الخروج؟')){
    lockApp();
  }
});

// ═══ التبويبات ═══
function switchTab(name){
  // تبويبات علوية
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  // شريط سفلي
  document.querySelectorAll('.bottom-nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  // لوحات
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
}

document.querySelectorAll('.tab, .bottom-nav-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

// ═══ تمرير كلمة المرور لـ iframes ═══
// كل iframe يقرأ كلمة المرور من localStorage مباشرة (نفس النطاق)
// لذلك لا حاجة لتمريرها يدوياً — iframes تتشارك localStorage مع الصفحة الأم

console.log('[Bitaqti SPA] loaded — كل الأنظمة في صفحة واحدة');
</script>
</body>
</html>
